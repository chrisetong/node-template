map $http_x_forwarded_proto $upstream_forwarded_proto {
  default $http_x_forwarded_proto;
  "" $scheme;
}

server {
  listen 80;
  server_name _;
  server_tokens off;

  root /usr/share/nginx/html;
  index index.html;

  client_max_body_size 6m;

  add_header X-Content-Type-Options "nosniff" always;
  add_header X-Frame-Options "DENY" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
  add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self'; object-src 'none'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;

  location = /healthz {
    access_log off;
    default_type text/plain;
    return 200 "ok\n";
  }

  location /api/ {
    proxy_pass http://app:3000/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $upstream_forwarded_proto;
    proxy_connect_timeout 5s;
    proxy_read_timeout 60s;
  }

  location /uploads/ {
    proxy_pass http://app:3000/uploads/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $upstream_forwarded_proto;
    expires 7d;
  }

  location = /admin {
    return 301 /admin/;
  }

  location = /admin/index.html {
    if ($request_uri ~ "^/admin/index\.html(?:\?.*)?$") {
      return 301 /admin/;
    }
    try_files /admin/index.html =404;
    expires -1;
  }

  location /admin/assets/ {
    try_files $uri =404;
    expires 1y;
  }

  location /admin/ {
    try_files $uri $uri/ /admin/index.html;
    expires -1;
  }

  # Reserved for a future mobile SPA. Never send /h5 requests to admin fallback.
  location = /h5 {
    return 404;
  }

  location ^~ /h5/ {
    return 404;
  }

  location / {
    return 404;
  }
}
